databases:
  - name: muevetechico-db
    plan: 0.1c-256mb
    databaseName: muevetechico
    user: muevetechico

services:
  - type: web
    name: muevetechico-api
    runtime: ruby
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: bundle install
    preDeployCommand: bundle exec rails db:prepare db:seed
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: muevetechico-db
          property: connectionString
      - key: APP_PROTOCOL
        value: https
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

  - type: web
    name: muevetechico-web
    runtime: node
    plan: 0.5c-512mb
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        fromService:
          name: muevetechico-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
