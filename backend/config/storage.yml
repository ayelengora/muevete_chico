test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= ENV.fetch("ACTIVE_STORAGE_ROOT", Rails.root.join("storage")) %>

# Cloudflare R2 (API compatible con S3). Bucket y credenciales se cargan
# desde variables de entorno (ver render.yaml) para no versionarlas.
production:
  service: S3
  endpoint: <%= ENV["R2_ENDPOINT"] %>
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  region: auto
  bucket: <%= ENV.fetch("R2_BUCKET", "muevetechico") %>
  force_path_style: true

# Remember not to checkin your GCS keyfile to a repository
